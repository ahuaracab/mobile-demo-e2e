name: Mobile E2E Tests (Maestro Cloud)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Maestro
        uses: mobile-dev-inc/setup-maestro@v1
        with:
          version: 2.8.0

      - name: Run E2E Tests on Maestro Cloud
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
        run: |
          maestro cloud \
            android/app/build/outputs/apk/release/app-release.apk \
            .maestro/ \
            --api-key $MAESTRO_API_KEY
