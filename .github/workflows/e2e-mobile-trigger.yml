name: Trigger Mobile E2E Tests in QA

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  trigger-qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger QA Mobile E2E Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TOKEN_MOBILE }}
          repository: ahuaracab/agentic-qa-simpliroute
          event-type: mobile-e2e-trigger
          client-payload: '{"ref": "${{ github.ref_name }}", "sha": "${{ github.sha }}", "event": "${{ github.event_name }}"}'