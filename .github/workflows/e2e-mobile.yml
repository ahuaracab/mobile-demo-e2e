name: Mobile E2E Tests (Maestro)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease

      - name: Install APK
        run: adb install -r android/app/build/outputs/apk/release/app-release.apk

      - name: Setup Maestro
        uses: remarkablemark/setup-maestro-cli@v1

      - name: Run Android Emulator & E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "=== Disable Pixel Launcher to prevent ANR ==="
            adb shell pm disable-user com.google.android.apps.nexuslauncher 2>/dev/null || true
            adb shell pm disable-user com.android.launcher3 2>/dev/null || true
            adb shell input keyevent KEYCODE_BACK 2>/dev/null || true
            sleep 2

            echo "=== Installing APK ==="
            adb install -r android/app/build/outputs/apk/release/app-release.apk

            echo "=== Running Maestro tests ==="
            maestro test .maestro/ --format junit --output /tmp/maestro-results.xml

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: |
            /tmp/maestro-results.xml
            ~/.maestro/tests/
          retention-days: 14
